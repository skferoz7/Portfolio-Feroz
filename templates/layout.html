<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feroz | Portfolio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font (Corporate friendly) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">Feroz</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
     <ul class="navbar-nav ms-auto mb-2 mb-lg-0 navbar-actions">
  <li class="nav-item">
    <a class="btn nav-btn" href="/">Home</a>
  </li>
  <li class="nav-item">
    <a class="btn nav-btn" href="/about">About</a>
  </li>
  <li class="nav-item">
    <a class="btn nav-btn" href="/projects">Projects</a>
  </li>
  <li class="nav-item">
    <a class="btn nav-btn" href="/contact">Contact</a>
  </li>
  <li>
    <button id="themeToggle" class="btn theme-btn ms-3">🌙</button>
  </li>
</ul>

    </div>
  </div>
</nav>

<!-- PAGE CONTENT -->
<main class="page-container">
  <div class="container py-5">
    {% block body %}{% endblock %}
  </div>
</main>

<!-- FOOTER -->
<footer class="py-3">
  <div class="container text-center text-muted small">
    © 2026 Feroz Shaik · Built with Flask & Bootstrap
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
